<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Countdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    /* Mobile First Layout (1 per row) */
    .cards-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Desktop Layout (3 per row for >= 1024px) */
    @media (min-width: 1024px) {
      .cards-container {
        grid-template-columns: repeat(3, 1fr);
      }

      .header-card {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="cards-container">

      <!-- HEADER CARD -->
      <header class="header-card">
        <div class="header">
          <span class="eyebrow">COUNTDOWN</span>
          <h1>Countdown Dashboard</h1>
          <p>Progress metrics across active tracking endpoints.</p>
        </div>
      </header>

      <app-countdown [counterResult]="counterResult" [counterName]="'TEST GENERIC API'"></app-countdown>
      <app-countdown [counterResult]="counterApiResult" [counterName]="'DAY API'"></app-countdown>
      <app-countdown [counterResult]="workResult" [counterName]="'WORK API'"></app-countdown>
      <app-countdown [counterResult]="weekendResult" [counterName]="'WEEKEND API'"></app-countdown>
      <app-countdown [counterResult]="yearResult" [counterName]="'WHOLE YEAR API'"></app-countdown>
      <app-countdown [counterResult]="hourResult" [counterName]="'HOUR API'"></app-countdown>





    </div>
  </div>

</body>
</html>
